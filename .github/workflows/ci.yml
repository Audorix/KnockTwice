# Continuous integration (Phase 21). Mirrors scripts/validate.ps1: the .NET solution with its unit,
# architecture and integration tests (SQLite always, PostgreSQL through a service container), and
# the web app's type-check, tests and production build.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # The integration tests create and drop their own chatx_test_* databases on this throwaway server.
      CHATX_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Audorix.ChatX.slnx
      - name: Build
        run: dotnet build Audorix.ChatX.slnx --no-restore --configuration Release
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution Audorix.ChatX.slnx --no-build --configuration Release 2>&1 | tee test-output.log
      # Failing tests as annotations on the run page, readable without opening (or signing in to) the log.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          grep -E -A 6 '^failed ' test-output.log | grep -v -E '^\s+at |^--$' | head -n 120 \
            | sed -E 's/%/%25/g' | while IFS= read -r line; do echo "::error title=Failing .NET test::${line}"; done || true

  web:
    name: Web type-check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same major version as docker/web.Dockerfile.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Type-check the website chat package (web/packages/chat-embed)
        run: npx tsc -p packages/chat-embed/tsconfig.json --noEmit
      - run: npm test
      - run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
