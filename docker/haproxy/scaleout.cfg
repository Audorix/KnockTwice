global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout http-request 30s
    timeout http-keep-alive 10s
    timeout tunnel 1h

frontend public
    bind :8080
    http-request set-header X-Forwarded-Proto http
    acl api_route path_beg /api/ /hubs/ /health/ /openapi/ /swagger/
    use_backend api_nodes if api_route
    default_backend web_app

backend api_nodes
    balance roundrobin
    cookie CHATX_NODE insert indirect nocache httponly
    option httpchk GET /health/ready
    http-check expect status 200
    http-response set-header X-ChatX-Node %[srv_name]
    server api-a api-a:8080 check inter 2s fall 2 rise 2 cookie api-a
    server api-b api-b:8080 check inter 2s fall 2 rise 2 cookie api-b

backend web_app
    server web web:8080 check
