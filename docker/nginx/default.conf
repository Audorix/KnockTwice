# Serves the React build and proxies API paths to the `api` compose service.
# TLS is expected to terminate at a reverse proxy in front of this container in production.

# WebSocket upgrade for the SignalR hub.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(api|health|openapi|swagger)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Attachment uploads: keep in line with Attachments:MaxFileSize (25 MB by default) plus
        # the multipart envelope. The API enforces the real limit; this only stops larger bodies early.
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_send_timeout 120s;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Embedded website chat (Phase 10, ADR-024): the only page that may be framed, and only by the
    # widget's allowed origins. The API answers the frame policy; nginx turns it into
    # Content-Security-Policy: frame-ancestors. Unknown or disabled widgets allow no one.
    location = /embed.html {
        if ($arg_widget !~ "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$") {
            return 404;
        }
        # Subrequests have no query string of their own but share variables set here.
        set $chatx_widget $arg_widget;
        auth_request /_chatx_frame_policy;
        auth_request_set $chatx_frame_ancestors $upstream_http_x_chatx_frame_ancestors;
        add_header Content-Security-Policy "frame-ancestors $chatx_frame_ancestors" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /embed.html =404;
    }

    location = /_chatx_frame_policy {
        internal;
        rewrite ^ /api/v1/widget/$chatx_widget/frame-policy break;
        proxy_pass http://api:8080;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # The loader is fetched by other websites; it must stay fresh after upgrades.
    location = /widget.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /widget.js =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
