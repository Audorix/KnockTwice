# Production-oriented profile: PostgreSQL, migrations as a one-off job, the API reachable only
# through the bundled nginx, and the web port bound to localhost for a TLS reverse proxy on the
# host (Caddy, nginx, Traefik, a cloud load balancer…). See docs/deployment-docker.md.
#
#   copy docker/.env.production.example to docker/.env.production and fill it in, then
#   docker compose -f docker/compose.production.yaml --env-file docker/.env.production up --build -d
name: chatx

x-api-image: &api-image
  build:
    context: ..
    dockerfile: docker/api.Dockerfile
  image: ${CHATX_API_IMAGE:-audorix/chatx-api:0.1.0}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  # The setup wizard (first start) writes email, captcha and the web address here.
  Setup__SettingsPath: /app/data/chatx.settings.json
  Storage__Local__Path: /app/data/attachments
  Database__Provider: PostgreSql
  Database__ConnectionString: Host=postgres;Port=5432;Database=chatx;Username=chatx;Password=${CHATX_POSTGRES_PASSWORD:?Set CHATX_POSTGRES_PASSWORD}
  # Only nginx (on the fixed network below) talks to the API, so its forwarded headers can be
  # believed; the TLS proxy on the host reaches nginx through the network gateway (also in range).
  Network__TrustedProxies__0: 172.30.0.0/24

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chatx
      POSTGRES_USER: chatx
      POSTGRES_PASSWORD: ${CHATX_POSTGRES_PASSWORD:?Set CHATX_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatx -d chatx"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [chatx]
    restart: unless-stopped

  # Applies pending migrations, then exits. Re-run before starting a new version:
  #   docker compose -f docker/compose.production.yaml --env-file docker/.env.production run --rm migrate
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chatx]
    restart: "no"

  api:
    <<: *api-image
    environment: *api-environment
    volumes:
      - api-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [chatx]
    # Not published: reachable only through the web service.
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: ${CHATX_WEB_IMAGE:-audorix/chatx-web:0.1.0}
    ports:
      # Localhost only: terminate TLS in front of it and forward to this port.
      - "127.0.0.1:${CHATX_WEB_PORT:-8080}:8080"
    depends_on:
      - api
    networks: [chatx]
    restart: unless-stopped

networks:
  chatx:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  api-data:
