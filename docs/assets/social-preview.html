<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:"Segoe UI",system-ui,sans-serif;color:#fff;
  background:radial-gradient(900px 500px at 85% 15%,#1b8f90 0%,rgba(27,143,144,0) 70%),linear-gradient(135deg,#0b3d3e 0%,#0e5556 55%,#127677 100%);
  position:relative}
.wrap{position:absolute;inset:0;padding:80px 96px 84px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:40px}
.logo{width:176px;height:176px;background:#fff;border-radius:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.logo svg{width:128px;height:128px}
h1{font-size:96px;font-weight:700;letter-spacing:-2px;line-height:1}
.by{font-size:30px;font-weight:400;opacity:.8;margin-top:14px}
.tag{font-size:42px;font-weight:600;line-height:1.25;max-width:1060px}
.chips{display:flex;gap:12px;flex-wrap:nowrap}
.chip{font-size:24px;font-weight:600;padding:9px 20px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.chip.hl{background:#2aaeb0;border-color:#2aaeb0}
.deco{position:absolute;right:-70px;bottom:-90px;width:520px;height:520px;opacity:.10}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 48 48">
      <path d="M13 7h14a10 10 0 0 1 10 10v5H23a9 9 0 0 0-9 9v-1H11l-6 4 1.4-6A9.6 9.6 0 0 1 3 21v-4A10 10 0 0 1 13 7z" fill="#127677"/>
      <path d="M23 17h14a9 9 0 0 1 9 9v8a9 9 0 0 1-5.2 8.2L42 47l-7-4H23a9 9 0 0 1-9-9v-8a9 9 0 0 1 9-9z" fill="#2aaeb0"/>
      <path d="M26.5 35.5l4.5-7M32.5 35.5l4.5-7" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
    </svg></div>
    <div><h1>Knock Twice</h1><div class="by">by Audorix · open source, MIT</div></div>
  </div>
  <div class="tag">Self-hosted team and customer chat,<br>with an embeddable website chat.</div>
  <div class="chips">
    <span class="chip">ASP.NET Core .NET 10</span><span class="chip">React</span>
    <span class="chip">SQLite · PostgreSQL</span><span class="chip">EN · ES</span>
    <span class="chip hl">docker compose up</span>
  </div>
</div>
</body></html>
